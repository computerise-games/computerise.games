<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voxel Worlds banner</title>
<!-- Source for img/banner-v0.2.0.png (1920x720). Serve the repo root, then:
     google-chrome --headless=new --window-size=1920,720 \
       --screenshot=img/banner-v0.2.0.png http://localhost:8070/banners/v0.2.0.html -->
<style>
  @font-face { font-family: Silkscreen; src: url(../fonts/Silkscreen-Regular.ttf); }
  @font-face { font-family: VT323; src: url(../fonts/VT323-Regular.ttf); }
  html, body { margin: 0; width: 1920px; height: 720px; overflow: hidden; background: #1c1830; }
  .art { position: absolute; inset: 0; background: url(../img/banner-voxel-worlds.webp) center / cover; }
  .shade { position: absolute; inset: 0;
           background: linear-gradient(to right, rgb(28 24 48 / .94) 0%, rgb(28 24 48 / .7) 34%, transparent 62%),
                       linear-gradient(to top, rgb(28 24 48 / .9) 0%, transparent 26%); }
  .text { position: absolute; left: 96px; top: 56px; width: 900px; display: flex;
          flex-direction: column; gap: 18px; color: #ece9f7; }
  .head { display: flex; align-items: center; gap: 22px; }
  .game { font: 34px/1 Silkscreen, monospace; letter-spacing: .04em; color: #ece9f7; }
  .tag { padding: 8px 18px; border-radius: 6px; border: 3px solid #8a7048;
         font: 28px/1 Silkscreen, monospace; color: #1c1830; background: #ff9a2e; }
  .date { font: 28px/1 Silkscreen, monospace; letter-spacing: .04em; color: #b9b2d6; }
  h1 { margin: 6px 0 0; font: 116px/1 Silkscreen, monospace; letter-spacing: .02em; color: #ffc266;
       text-shadow: 0 8px 0 #7a3b0e; }
  p { margin: 0; font: 42px/1.15 VT323, monospace; max-width: 24ch; }
  /* Other voxel worlds along the bottom: each 26 art px icon at 4 screen px
     per art px, so they stay crisp. */
  .worlds { position: absolute; left: 96px; bottom: 40px; display: flex; align-items: center; gap: 26px; }
  .worlds img { width: 104px; height: 104px; image-rendering: pixelated;
                filter: drop-shadow(0 6px 10px rgb(0 0 0 / .45)); }
  .url { position: absolute; right: 56px; bottom: 44px; font: 26px/1 Silkscreen, monospace;
         color: #ece9f7; letter-spacing: .04em; text-shadow: 0 2px 0 #1c1830; }
</style>
</head>
<body>
  <div class="art"></div>
  <div class="shade"></div>
  <div class="text">
    <div class="head"><div class="game">New Worlds</div><div class="tag">v0.2.0</div><div class="date">7 Oct 2026</div></div>
    <h1>Voxel Worlds</h1>
    <p>All worlds, ships and stations now have 3D voxel models!</p>
  </div>
  <div class="worlds">
    <img src="../img/worlds/aquara.png" alt="">
    <img src="../img/worlds/ferrum.png" alt="">
    <img src="../img/worlds/arida.png" alt="">
    <img src="../img/worlds/serena.png" alt="">
    <img src="../img/worlds/caeruleus.png" alt="">
    <img src="../img/worlds/glacius.png" alt="">
    <img src="../img/worlds/silva.png" alt="">
    <img src="../img/worlds/lutum.png" alt="">
  </div>
  <div class="url">playnewworlds.com</div>
</body>
</html>
